<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a5dcff"/>
      <stop offset="1" stop-color="#7fc8fb"/>
    </linearGradient>
    <linearGradient id="heart" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#ff7ba3"/>
      <stop offset="0.55" stop-color="#ff5c8a"/>
      <stop offset="1" stop-color="#d93a6b"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.3" cy="0.25" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#8a1f45" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="500" height="500" fill="url(#bg)"/>
  <!-- 배경 장식 점 -->
  <g fill="#ffffff" opacity="0.5">
    <circle cx="70" cy="90" r="6"/>
    <circle cx="430" cy="120" r="9"/>
    <circle cx="90" cy="400" r="8"/>
    <circle cx="420" cy="390" r="5"/>
    <circle cx="250" cy="55" r="4"/>
  </g>
  <g filter="url(#shadow)">
    <path fill="url(#heart)" d="M250 440
      C 200 400, 70 320, 70 190
      C 70 120, 125 75, 185 75
      C 215 75, 238 90, 250 110
      C 262 90, 285 75, 315 75
      C 375 75, 430 120, 430 190
      C 430 320, 300 400, 250 440 Z"/>
  </g>
  <!-- 하이라이트 -->
  <ellipse cx="165" cy="150" rx="48" ry="30" transform="rotate(-30 165 150)" fill="url(#shine)"/>
  <ellipse cx="150" cy="140" rx="16" ry="10" transform="rotate(-30 150 140)" fill="#ffffff" opacity="0.9"/>
</svg>
